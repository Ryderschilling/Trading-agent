<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0f15" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agent" />
<meta name="robots" content="noindex, nofollow" />
<title>Trading Agent — Investor Access</title>
<style>
  :root{
    --bg:#0b0f15; --card:#0f1520; --text:#e7edf6; --muted:#9aa6bb;
    --line:rgba(255,255,255,0.10); --accent:#5da9ff; --neg:#ef4444;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    background:
      radial-gradient(900px 500px at 20% -10%, rgba(93,169,255,0.12), transparent 60%),
      radial-gradient(700px 400px at 100% 110%, rgba(34,197,94,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  .card{
    width:100%; max-width:400px; background:var(--card);
    border:1px solid var(--line); border-radius:20px; padding:36px 32px;
    box-shadow:0 18px 48px rgba(0,0,0,0.5);
  }
  .mark{
    font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--muted); margin-bottom:20px;
  }
  h1{font-size:26px; margin:0 0 6px; letter-spacing:-0.02em}
  p.sub{margin:0 0 26px; color:var(--muted); font-size:14px; line-height:1.5}
  label{display:block; font-size:12px; color:var(--muted); margin-bottom:8px}
  input{
    width:100%; padding:13px 14px; border-radius:12px; font-size:15px;
    background:rgba(255,255,255,0.04); border:1px solid var(--line);
    color:var(--text); outline:none; transition:border-color .15s, background .15s;
  }
  input:focus{border-color:var(--accent); background:rgba(93,169,255,0.06)}
  button{
    width:100%; margin-top:18px; padding:13px; border-radius:12px; border:0;
    background:var(--accent); color:#04121f; font-size:15px; font-weight:650;
    cursor:pointer; transition:opacity .15s;
  }
  button:hover{opacity:.9}
  button:disabled{opacity:.5; cursor:default}
  .err{
    margin-top:16px; padding:11px 13px; border-radius:10px; font-size:13px;
    background:rgba(239,68,68,0.10); border:1px solid rgba(239,68,68,0.35);
    color:#ffb4b4; display:none;
  }
  .err.show{display:block}
</style>
</head>
<body>
  <form class="card" id="form">
    <div class="mark">Ryder Schilling LLC</div>
    <h1>Trading Agent</h1>
    <p class="sub">Investor access. Enter the password you were given to view account performance.</p>

    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required />

    <button id="btn" type="submit">View dashboard</button>
    <div class="err" id="err"></div>
  </form>

<script>
  const form = document.getElementById('form');
  const btn  = document.getElementById('btn');
  const err  = document.getElementById('err');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Checking…';

    try {
      const res = await fetch('/api/investor/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value })
      });
      const data = await res.json().catch(() => ({}));

      if (res.ok && data.ok) { window.location.href = '/investor'; return; }
      err.textContent = data.error || 'Something went wrong. Try again.';
      err.classList.add('show');
    } catch (_) {
      err.textContent = 'Could not reach the server. Try again in a moment.';
      err.classList.add('show');
    }

    btn.disabled = false;
    btn.textContent = 'View dashboard';
  });
</script>
</body>
</html>
